<div class="dashboard">
  <header class="header">
    <div>
      <h1>Panel de Usuario</h1>
      <p>
        Bienvenido,
        <strong>{{ username }}</strong>
      </p>
    </div>
    <button
      type="button"
      (click)="cerrarSesion()">
      Cerrar sesión
    </button>
  </header>
  <main class="contenido">
    <h2>Mis opciones</h2>
    <div class="cards">
      <div
        class="card"
        (click)="irPerfil()">
        <h3>Mi perfil</h3>
        <p>
          Consultar mis datos
        </p>
      </div>
      <div
        class="card"
        (click)="irClientes()">
        <h3>Clientes</h3>
        <p>
          Consultar clientes
        </p>
      </div>
    </div>
  </main>
</div>
